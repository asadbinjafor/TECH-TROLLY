name: Production health

on:
  schedule:
    # Every five minutes, offset from the busy start of each hour (UTC).
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [codex/tech-trolley-production]
    paths:
      - .github/workflows/production-health.yml
      - scripts/check-production-health.mjs

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  readiness:
    # Public standard runners are free. Do not incur private-repository usage
    # or contact this production service from forks.
    if: github.repository == 'asadbinjafor/TECH-TROLLY' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check database-backed API readiness
        run: node scripts/check-production-health.mjs
