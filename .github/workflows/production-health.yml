name: Production health

on:
  schedule:
    # Best-effort fallback during approved 09:00-24:00 Asia/Dhaka shop hours only.
    # GitHub cron is UTC; cron-job.org supplies the regular five-minute checks.
    - cron: "2-59/5 3-17 * * *"
  workflow_dispatch:
  push:
    branches: [codex/tech-trolley-production]
    paths:
      - .github/workflows/production-health.yml
      - scripts/check-production-health.mjs

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  readiness:
    # Public standard runners are free. Do not incur private-repository usage
    # or contact this production service from forks.
    if: github.repository == 'asadbinjafor/TECH-TROLLY' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check database-backed API readiness
        run: |
          # A delayed scheduled run must not wake Render after shop hours.
          # Explicit manual/push checks remain available for recovery/release verification.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$(date -u +%H)" in
              0[3-9]|1[0-7]) ;;
              *) echo "Skipped delayed scheduled check outside Asia/Dhaka shop hours."; exit 0 ;;
            esac
          fi
          node scripts/check-production-health.mjs
