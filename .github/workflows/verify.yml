name: Verify
on:
  push:
    branches: [codex/tech-trolley-production]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: trolley_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: trolley_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://trolley_test:ci-test-only@localhost:5432/trolley_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run export -w @tech-trolley/mobile
      - run: npx expo-doctor
        working-directory: tech-trolley-mobile
